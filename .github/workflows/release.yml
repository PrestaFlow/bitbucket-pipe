name: Release

on:
  push:
    tags:
      - 'v*'

# The image goes to GitHub Container Registry with the workflow's own
# GITHUB_TOKEN: no registry account or secret to set up.
permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/prestaflow/pipe-push

jobs:
  publish-docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive image tag from ref
        id: tag
        run: |
          set -euo pipefail
          # v1.2.3 → 1.2.3
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # semantic major (1.2.3 → 1) for a moving major tag
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - name: Check pipe.yml points at this version
        run: |
          set -euo pipefail
          expected="image: ${IMAGE}:${{ steps.tag.outputs.version }}"
          if ! grep -qxF "$expected" pipe.yml; then
            echo "::error::pipe.yml must say '${expected}' for this release."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.tag.outputs.major }}
            ${{ env.IMAGE }}:latest

      - name: Note next steps
        run: |
          echo "::notice::Image pushed as ${IMAGE}:${{ steps.tag.outputs.version }} (+ major/latest). Consumers reference 'pipe: docker://${IMAGE}:${{ steps.tag.outputs.version }}' in bitbucket-pipelines.yml. On the first release, make the package public (Package settings → Change visibility)."
